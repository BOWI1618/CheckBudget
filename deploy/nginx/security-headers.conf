# Заголовки безопасности. ОТДЕЛЬНЫЙ ФАЙЛ, И ЭТО НЕ УКРАШЕНИЕ.
#
# В nginx `add_header` наследуется вложенным блоком ТОЛЬКО пока у того нет
# своего `add_header`. Появился хоть один — и все родительские молча
# исчезают. У нас блоки статики задают Cache-Control, поэтому главная
# страница отдавалась вообще без HSTS и CSP: ровно там, где они нужнее
# всего. Ошибка не видна ни в `nginx -t`, ни глазами по конфигу — только
# в ответе сервера.
#
# Поэтому набор вынесен сюда и подключается ЯВНО в каждый такой блок.
#
# Ставится в /etc/nginx/snippets/checkbudget-security.conf

# Telegram открывает Mini App в iframe, поэтому X-Frame-Options не ставим,
# а ограничиваем встраивание точнее — списком доменов.
add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
# После первого визита браузер ходит только по HTTPS, и активный посредник
# больше не подсунет незашифрованную версию. preload не ставим намеренно:
# он необратим на месяцы.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
