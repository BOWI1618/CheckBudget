# CheckBudget: статика клиента и прокси к API на одном домене.
#
# Один домен — не экономия, а требование: клиент ходит по относительным
# путям (/api/v1, /ws), а refresh-токен лежит в cookie с SameSite=strict.
# Разнеси их по разным доменам — и cookie перестанет отправляться.
#
# Файл ставится как /etc/nginx/sites-available/checkbudget, __DOMAIN__
# заменяется на настоящий домен (это делает provision.sh).
#
# ЗДЕСЬ ТОЛЬКО HTTP, И ЭТО НАМЕРЕННО. `certbot --nginx` берёт готовый
# server-блок, копирует его содержимое в новый блок с TLS и дописывает
# редирект с 80-го порта. Поэтому все location-блоки должны существовать
# ДО выпуска сертификата — иначе в HTTPS-версию они просто не попадут.
# После certbot этот файл изменён им; provision.sh его больше не трогает.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /opt/checkbudget/web/dist;
    index index.html;

    # X-Frame-Options НЕ ставим намеренно: Telegram открывает Mini App
    # в iframe на десктопе и в вебе, и запрет встраивания сломал бы его.
    # Ограничение задаётся точнее — через frame-ancestors.
    # Версию nginx наружу не отдаём: она подсказывает атакующему известные CVE.
    server_tokens off;

    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # HSTS: после первого визита браузер ходит только по HTTPS, и активный
    # посредник больше не может подсунуть незашифрованную версию. По HTTP
    # заголовок игнорируется спецификацией, поэтому в едином server-блоке
    # он безвреден, а после certbot попадает в HTTPS-блок и начинает
    # действовать. preload не ставим намеренно: он необратим на месяцы.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ассеты собраны с хешем в имени: их можно кешировать навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кешируется никогда. Иначе после выката человек
    # продолжает открывать старую страницу, которая просит несуществующие
    # ассеты, и приложение молча не грузится.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-store";
    }

    # Service worker кешировать нельзя вообще. Закешированный sw.js живёт
    # своей жизнью месяцами: браузер не идёт за новым, старый продолжает
    # отдавать старую оболочку, и выкат «не доезжает» до людей — при том
    # что на сервере всё новое.
    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    # Состояние приложения. Отдельным блоком, потому что маршрут лежит
    # в корне, а не под /api — без этого сюда попадала бы статика и
    # проверка возвращала бы index.html с кодом 200.
    # /health — только для локальных проверок (release.sh, мониторинг
    # на самом сервере). Наружу счётчики соединений и состояние пула БД
    # отдавать незачем: это разведданные для атакующего. 127.0.0.1 ходит
    # к приложению напрямую, минуя nginx, поэтому проверки не ломаются.
    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Заменяем заголовок адресом реального соединения, а НЕ дополняем
        # ($proxy_add_x_forwarded_for). Дополнение сохраняет присланный
        # клиентом X-Forwarded-For, а его подделкой обходится анти-перебор.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Соединение синхронизации. Без Upgrade и Connection апгрейд не проходит,
    # а без длинного таймаута nginx рвёт живое соединение раз в минуту,
    # и клиент бесконечно переподключается.
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: любой неизвестный путь отдаёт index.html, маршрут разбирает клиент.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
